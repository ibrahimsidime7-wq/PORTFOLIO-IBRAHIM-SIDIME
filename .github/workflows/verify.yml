name: Verify portfolio

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/supabase-state-persistence]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
